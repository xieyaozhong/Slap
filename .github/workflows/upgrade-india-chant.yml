name: Upgrade India hit chant

on:
  push:
    paths:
      - 'tools/add_india_chant.py'
      - '.github/workflows/upgrade-india-chant.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate India reaction audio and patch app
        run: python3 tools/add_india_chant.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/slap.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/slap.js
      - name: Commit India reaction pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js sounds/india INDIA_AUDIO_LICENSE.md
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Upgrade India hit reaction with original du-du-du chant'
            git push
          fi
