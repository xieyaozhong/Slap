name: Apply SLAP Mobile Touch Guard

on:
  push:
    paths:
      - 'scripts/apply_touch_guard.py'
      - '.github/workflows/add-touch-guard.yml'

permissions:
  contents: write

jobs:
  apply-touch-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Touch Guard patch
        run: python3 scripts/apply_touch_guard.py

      - name: Validate JavaScript
        run: node --check /tmp/slap-inline.js

      - name: Commit upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Upgrade SLAP Mobile to 3.3 Touch Guard'
            git push
          fi
