name: Vendor CC0 audio into SLAP Mobile

on:
  push:
    paths:
      - '.github/workflows/vendor-cc0-audio.yml'

permissions:
  contents: write

jobs:
  vendor-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CC0 sound pack
        shell: bash
        run: |
          set -e
          mkdir -p sounds
          BASE="https://raw.githubusercontent.com/Silentnoob21/cc0-public-domain-sounds/main/kenney_impactsounds/Audio"
          curl -L --fail --retry 3 "$BASE/impactSoft_medium_000.ogg"  -o sounds/slap-soft.ogg
          curl -L --fail --retry 3 "$BASE/impactPunch_medium_000.ogg" -o sounds/slap-medium.ogg
          curl -L --fail --retry 3 "$BASE/impactPunch_heavy_000.ogg"  -o sounds/slap-heavy.ogg
          curl -L --fail --retry 3 "$BASE/impactWood_heavy_000.ogg"   -o sounds/bonk.ogg
          curl -L --fail --retry 3 "$BASE/impactGlass_heavy_000.ogg"  -o sounds/crash.ogg
          curl -L --fail --retry 3 "$BASE/impactBell_heavy_004.ogg"   -o sounds/bell.ogg
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://opengameart.org/sites/default/files/Meow.ogg" -o sounds/cat.ogg || rm -f sounds/cat.ogg
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://opengameart.org/sites/default/files/alarm_0.ogg" -o sounds/alarm.ogg || rm -f sounds/alarm.ogg
          find sounds -type f -size 0 -delete
          ls -lh sounds

      - name: Integrate real audio and offline cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>SLAP! Mobile 3.0</title>', '<title>SLAP! Mobile 3.1 · CC0 Audio Pack</title>')
          s = s.replace('<span class="ver">3.0</span>', '<span class="ver">3.1</span>')
          s = s.replace('SLAP! Mobile 3.0 · Motion data stays on this device · PWA', 'SLAP! Mobile 3.1 · Built-in CC0 Audio · Motion data stays on this device · PWA')
          s = s.replace('<div class="card"><h2>音效風格</h2>', '<div class="card"><h2>內建 CC0 音效 <small style="font-size:9px;color:#7f8996;font-weight:800">REAL AUDIO</small></h2>')

          start = s.index('function playSound(power=10,kind=state.sound){')
          end = s.index('\nlet alarmInt=', start)
          replacement = r'''const sampleFiles={
            slap:['./sounds/slap-soft.ogg','./sounds/slap-medium.ogg','./sounds/slap-heavy.ogg'],
            bonk:['./sounds/bonk.ogg'],cat:['./sounds/cat.ogg'],crash:['./sounds/crash.ogg'],
            arcade:['./sounds/bell.ogg'],siren:['./sounds/alarm.ogg']
          };
          const sampleBroken=new Set();
          function samplePath(kind,power){const arr=sampleFiles[kind];if(!arr||!arr.length)return null;if(kind==='slap'){const r=power/state.threshold;return arr[r<1.3?0:r<1.9?1:2]}return arr[0]}
          function synthSound(power=10,kind=state.sound){const p=Math.min(1.5,Math.max(.45,power/14));try{if(kind==='slap'){noise(.055,.23*p);tone(150,.065,'triangle',.23*p)}else if(kind==='bonk'){tone(105,.16,'sine',.34*p);tone(73,.2,'sine',.16*p,.015)}else if(kind==='cat'){tone(620,.07,'sine',.16);tone(780,.11,'triangle',.14,.06);tone(540,.13,'sine',.12,.14)}else if(kind==='crash'){noise(.22,.34*p);tone(70,.2,'sawtooth',.12)}else if(kind==='arcade'){tone(440,.06,'square',.12);tone(660,.07,'square',.11,.06);tone(880,.08,'square',.1,.13)}else if(kind==='siren'){tone(520,.22,'sawtooth',.16);tone(760,.22,'sawtooth',.14,.22)}}catch(e){}}
          function playSound(power=10,kind=state.sound){const src=samplePath(kind,power);if(!src||sampleBroken.has(src)){synthSound(power,kind);return}try{const el=new Audio(src);el.preload='auto';el.volume=Math.min(1,.48+power/32);if(kind!=='siren')el.playbackRate=Math.max(.9,Math.min(1.12,.98+(power-state.threshold)/90+(Math.random()-.5)*.035));const promise=el.play();if(promise&&promise.catch)promise.catch(()=>{sampleBroken.add(src);synthSound(power,kind)});el.onerror=()=>{sampleBroken.add(src);synthSound(power,kind)}}catch(e){sampleBroken.add(src);synthSound(power,kind)}}'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

          sounds = sorted('./' + str(x).replace('\\','/') for x in Path('sounds').glob('*') if x.is_file())
          assets = ['./','./index.html','./manifest.webmanifest','./icon.svg'] + sounds
          sw = "const CACHE='slap-mobile-v4-cc0';\nconst ASSETS=" + json.dumps(assets, ensure_ascii=False) + ";\n\n" + r'''self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)));self.skipWaiting()});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim()});
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;if(event.request.mode==='navigate'){event.respondWith(fetch(event.request).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put('./index.html',copy));return r}).catch(()=>caches.match('./index.html')));return}event.respondWith(caches.match(event.request).then(hit=>hit||fetch(event.request).then(r=>{if(r&&r.ok){const copy=r.clone();caches.open(CACHE).then(c=>c.put(event.request,copy))}return r}))) });'''
          Path('sw.js').write_text(sw, encoding='utf-8')
          PY

      - name: Add audio license record
        shell: bash
        run: |
          cat > AUDIO_LICENSES.md <<'EOF'
          # Built-in audio licenses

          SLAP! Mobile vendors the following sound effects into this repository so the PWA can play them without runtime hotlinking.

          ## Kenney — Impact Sounds 1.0
          License: Creative Commons Zero (CC0 1.0). Attribution is appreciated but not required.
          Source: https://kenney.nl/assets/impact-sounds

          Vendored selections:
          - `sounds/slap-soft.ogg` — `impactSoft_medium_000.ogg`
          - `sounds/slap-medium.ogg` — `impactPunch_medium_000.ogg`
          - `sounds/slap-heavy.ogg` — `impactPunch_heavy_000.ogg`
          - `sounds/bonk.ogg` — `impactWood_heavy_000.ogg`
          - `sounds/crash.ogg` — `impactGlass_heavy_000.ogg`
          - `sounds/bell.ogg` — `impactBell_heavy_004.ogg`

          ## OpenGameArt — Meow by IgnasD
          License: CC0.
          Source: https://opengameart.org/content/meow
          Vendored when upstream download is available: `sounds/cat.ogg`.

          ## OpenGameArt — Short alarm by yd
          License: CC0.
          Source: https://opengameart.org/content/short-alarm
          Vendored when upstream download is available: `sounds/alarm.ogg`.

          If an optional upstream file is unavailable during vendoring, SLAP! Mobile keeps its synthesized fallback for that preset.
          EOF

      - name: Commit bundled audio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js AUDIO_LICENSES.md sounds
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Bundle CC0 sound effects into SLAP Mobile"
            git push
          fi
