name: Upgrade Avatar Voice UI

on:
  push:
    paths:
      - 'tools/upgrade_avatar_ui.py'
      - '.github/workflows/upgrade-avatar-ui.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build avatar voice UI
        run: python3 tools/upgrade_avatar_ui.py
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/slap.js').write_text(m.group(1),encoding='utf-8')
          assert '內建 CC0 音效' not in s
          assert s.count('class="preset avatarPreset"') == 6
          assert 'SLAP! Mobile 3.9 · Avatar Voice Pack' in s
          PY
          node --check /tmp/slap.js
      - name: Verify avatar assets
        run: |
          test -f assets/avatars/avatar-random.svg
          test -f assets/avatars/avatar-male.svg
          test -f assets/avatars/avatar-female.svg
          test -f assets/avatars/avatar-short-hurt.svg
          test -f assets/avatars/avatar-yell.svg
          test -f assets/avatars/avatar-heavy-hit.svg
          test -f ICON_SOURCES.md
      - name: Commit 3.9 upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Upgrade SLAP Mobile to 3.9 avatar voice pack'
            git push
          fi
