name: Expand CC0 human hit voices

on:
  push:
    paths:
      - 'tools/expand_human_voices.py'
      - '.github/workflows/expand-human-voices.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg p7zip-full
      - name: Vendor CC0 human voices and simplify presets
        run: python3 tools/expand_human_voices.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          Path('/tmp/slap.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/slap.js
      - name: Commit human voice expansion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Expand CC0 human hit voice pack and remove chant sounds'
            git push
          fi
